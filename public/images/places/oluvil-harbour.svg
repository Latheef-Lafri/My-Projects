<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="harbourSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="harbourSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#harbourSky)"/>

  <!-- Open Sea -->
  <rect x="0" y="240" width="800" height="260" fill="url(#harbourSea)"/>

  <!-- Concrete Breakwater Pier Arm -->
  <polygon points="0,480 380,310 440,310 240,500" fill="#64748b"/>
  <polygon points="380,310 440,310 450,335 370,335" fill="#475569"/>

  <!-- Breakwater Dolos Rocks -->
  <ellipse cx="260" cy="460" rx="35" ry="18" fill="#334155"/>
  <ellipse cx="320" cy="430" rx="30" ry="16" fill="#1e293b"/>
  <ellipse cx="370" cy="390" rx="25" ry="14" fill="#334155"/>

  <!-- Distant Port Berth & Crane Silhouettes -->
  <rect x="520" y="260" width="180" height="15" fill="#0f172a"/>
  <!-- Crane 1 -->
  <line x1="550" y1="260" x2="570" y2="190" stroke="#0f172a" stroke-width="4"/>
  <line x1="570" y1="190" x2="630" y2="180" stroke="#0f172a" stroke-width="3"/>
  <line x1="570" y1="190" x2="540" y2="210" stroke="#0f172a" stroke-width="2"/>

  <!-- Docked Vessel -->
  <path d="M 450,285 L 510,285 L 530,270 L 440,270 Z" fill="#b91c1c"/>
  <rect x="460" y="255" width="30" height="15" fill="#f8fafc"/>

  <!-- Waves -->
  <path d="M 10,380 Q 80,370 150,380" stroke="#bae6fd" stroke-width="2" fill="none"/>
  <path d="M 500,360 Q 600,350 720,360" stroke="#bae6fd" stroke-width="2" fill="none"/>

  <!-- Info Overlay -->
  <rect x="30" y="30" width="300" height="48" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.2)"/>
  <text x="45" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="16">OLUVIL HARBOUR</text>
  <text x="45" y="72" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="10">COASTAL &amp; MARITIME LANDMARK • 10 KM</text>
</svg>
