<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="academicSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#academicSky)"/>

  <!-- Lawns -->
  <rect x="0" y="360" width="800" height="140" fill="#15803d"/>
  <polygon points="340,500 460,500 420,360 380,360" fill="#64748b"/>

  <!-- University Iconic Gate / Archway -->
  <!-- Main Entrance Building -->
  <rect x="220" y="220" width="360" height="140" fill="url(#gateGrad)" rx="3"/>
  <polygon points="200,220 400,140 600,220" fill="#991b1b"/>

  <!-- Arch Openings -->
  <path d="M 350,360 L 350,270 Q 400,240 450,270 L 450,360 Z" fill="#0f172a"/>
  <path d="M 260,360 L 260,290 Q 290,270 320,290 L 320,360 Z" fill="#1e293b"/>
  <path d="M 480,360 L 480,290 Q 510,270 540,290 L 540,360 Z" fill="#1e293b"/>

  <!-- Academic Crest Emblem Accent -->
  <circle cx="400" cy="190" r="14" fill="#fbbf24"/>
  <circle cx="400" cy="190" r="10" fill="#1e3a8a"/>

  <!-- Palm Avenue on Sides -->
  <line x1="120" y1="460" x2="135" y2="280" stroke="#78350f" stroke-width="8"/>
  <circle cx="135" cy="275" r="35" fill="#166534"/>

  <line x1="680" y1="460" x2="665" y2="280" stroke="#78350f" stroke-width="8"/>
  <circle cx="665" cy="275" r="35" fill="#166534"/>

  <!-- Info Overlay -->
  <rect x="30" y="30" width="370" height="48" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.2)"/>
  <text x="45" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">SOUTH EASTERN UNIVERSITY (SEUSL)</text>
  <text x="45" y="72" fill="#93c5fd" font-family="system-ui, sans-serif" font-weight="600" font-size="10">EDUCATIONAL LANDMARK • 8 KM (OLUVIL)</text>
</svg>
