<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="painthaaruSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="bankGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#painthaaruSky)"/>

  <!-- Background Forest & Paddy -->
  <path d="M 0,260 Q 200,220 400,250 Q 600,210 800,240 L 800,500 L 0,500 Z" fill="#22c55e" opacity="0.6"/>

  <!-- Stream Banks -->
  <path d="M 0,290 C 200,290 250,380 0,500 Z" fill="url(#bankGrad)"/>
  <path d="M 800,270 C 600,280 500,420 800,500 Z" fill="url(#bankGrad)"/>

  <!-- Freshwater Stream Curve -->
  <path d="M 0,310 C 350,300 450,450 800,420 L 800,500 L 0,500 Z" fill="url(#streamGrad)"/>

  <!-- Stream Water Ripples & Cascades -->
  <path d="M 220,340 Q 260,335 300,340" stroke="#cffafe" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 360,380 Q 420,370 480,380" stroke="#cffafe" stroke-width="4" fill="none" opacity="0.9"/>
  <path d="M 450,440 Q 530,430 620,440" stroke="#cffafe" stroke-width="4" fill="none" opacity="0.8"/>

  <!-- Riverbed Boulders -->
  <ellipse cx="280" cy="365" rx="28" ry="16" fill="#64748b"/>
  <ellipse cx="490" cy="410" rx="36" ry="20" fill="#475569"/>

  <!-- Info Overlay -->
  <rect x="30" y="30" width="280" height="48" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.2)"/>
  <text x="45" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="16">PAINTHAARU STREAM</text>
  <text x="45" y="72" fill="#67e8f9" font-family="system-ui, sans-serif" font-weight="600" font-size="10">NATURE &amp; BATHING SPOT • 16 KM</text>
</svg>
