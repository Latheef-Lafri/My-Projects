<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7c04a"/>
      <stop offset="100%" stop-color="#d49a24"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Sky & Stars -->
  <rect width="800" height="500" fill="url(#skyGrad1)"/>
  <circle cx="120" cy="90" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="280" cy="70" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="450" cy="110" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="680" cy="80" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="720" cy="140" r="1.5" fill="#ffffff" opacity="0.5"/>

  <!-- Crescent Moon -->
  <path d="M 690,75 A 35,35 0 1 0 735,115 A 30,30 0 1 1 690,75 Z" fill="#ffd166" opacity="0.9"/>

  <!-- Mosque Silhouette & Structure -->
  <!-- Base Ground -->
  <rect x="0" y="380" width="800" height="120" fill="#1e293b"/>
  <rect x="0" y="375" width="800" height="8" fill="url(#accentGrad)"/>

  <!-- Main Mosque Hall -->
  <rect x="220" y="240" width="360" height="140" rx="4" fill="url(#wallGrad)"/>

  <!-- Central Great Dome -->
  <path d="M 330,240 Q 400,120 470,240 Z" fill="url(#domeGrad)"/>
  <rect x="398" y="95" width="4" height="28" fill="#ffd166"/>
  <circle cx="400" cy="92" r="5" fill="#ffd166"/>
  <path d="M 397,80 A 6,6 0 1 0 404,86 A 5,5 0 1 1 397,80 Z" fill="#ffd166"/>

  <!-- Left Minaret -->
  <rect x="170" y="160" width="42" height="220" fill="url(#wallGrad)"/>
  <path d="M 166,160 L 191,100 L 216,160 Z" fill="url(#domeGrad)"/>
  <circle cx="191" cy="95" r="4" fill="#ffd166"/>
  <rect x="160" y="210" width="62" height="10" fill="#cbd5e1" rx="2"/>

  <!-- Right Minaret -->
  <rect x="588" y="160" width="42" height="220" fill="url(#wallGrad)"/>
  <path d="M 584,160 L 609,100 L 634,160 Z" fill="url(#domeGrad)"/>
  <circle cx="609" cy="95" r="4" fill="#ffd166"/>
  <rect x="578" y="210" width="62" height="10" fill="#cbd5e1" rx="2"/>

  <!-- Mosque Arches & Doors -->
  <path d="M 360,380 L 360,300 Q 400,270 440,300 L 440,380 Z" fill="#0f172a"/>
  <path d="M 260,380 L 260,320 Q 285,300 310,320 L 310,380 Z" fill="#334155"/>
  <path d="M 490,380 L 490,320 Q 515,300 540,320 L 540,380 Z" fill="#334155"/>

  <!-- Decorative Badge Overlay -->
  <rect x="30" y="30" width="310" height="48" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.2)"/>
  <text x="45" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="16">SAMMANTHURAI GRAND MASJID</text>
  <text x="45" y="72" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="10">RELIGIOUS &amp; HERITAGE • 1 KM DISTANCE</text>
</svg>
