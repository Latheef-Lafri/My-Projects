<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="oluvilBeachSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="oluvilSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="duneSand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#oluvilBeachSky)"/>

  <!-- Sun -->
  <circle cx="200" cy="140" r="35" fill="#fef08a" opacity="0.9"/>

  <!-- Horizon & Sea -->
  <rect x="0" y="240" width="800" height="150" fill="url(#oluvilSea)"/>

  <!-- Gentle Waves -->
  <path d="M 0,340 C 250,330 500,350 800,335 L 800,500 L 0,500 Z" fill="#f8fafc" opacity="0.7"/>

  <!-- Sandy Shore Dunes -->
  <path d="M 0,360 C 300,330 550,380 800,355 L 800,500 L 0,500 Z" fill="url(#duneSand)"/>

  <!-- Casuarina Coastal Trees Silhouettes -->
  <!-- Tree 1 -->
  <polygon points="680,260 670,360 690,360" fill="#14532d"/>
  <polygon points="680,220 665,300 695,300" fill="#15803d"/>
  <line x1="680" y1="360" x2="680" y2="390" stroke="#78350f" stroke-width="4"/>
  <!-- Tree 2 -->
  <polygon points="730,280 720,370 740,370" fill="#14532d"/>
  <polygon points="730,240 715,310 745,310" fill="#16a34a"/>
  <line x1="730" y1="370" x2="730" y2="400" stroke="#78350f" stroke-width="4"/>

  <!-- Driftwood Accent -->
  <path d="M 160,420 Q 200,410 240,430" stroke="#78350f" stroke-width="5" fill="none"/>

  <!-- Info Overlay -->
  <rect x="30" y="30" width="280" height="48" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.2)"/>
  <text x="45" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="16">OLUVIL BEACH</text>
  <text x="45" y="72" fill="#2dd4bf" font-family="system-ui, sans-serif" font-weight="600" font-size="10">COASTAL &amp; BEACH NATURE • 10 KM</text>
</svg>
