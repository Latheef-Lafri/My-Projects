<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="80%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="lighthouseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#twilightSky)"/>

  <!-- Ocean Surf & Rocks -->
  <rect x="0" y="320" width="800" height="180" fill="#0f172a"/>
  <path d="M 0,330 Q 250,305 500,325 Q 700,310 800,320 L 800,500 L 0,500 Z" fill="#1e293b"/>

  <!-- Coastal Promontory / Cliff Base -->
  <path d="M 0,500 L 0,420 Q 180,380 340,430 L 360,500 Z" fill="#334155"/>

  <!-- Lighthouse Lantern Beam -->
  <polygon points="210,135 800,40 800,200 210,145" fill="url(#beamGrad)"/>

  <!-- Iconic 24m Oluvil Lighthouse Tower -->
  <!-- Tower Base -->
  <polygon points="175,410 245,410 230,150 190,150" fill="url(#lighthouseGrad)"/>
  <!-- Red Band Accents -->
  <polygon points="182,340 238,340 235,310 185,310" fill="#dc2626"/>
  <polygon points="188,240 232,240 229,210 191,210" fill="#dc2626"/>

  <!-- Lantern Room & Balcony -->
  <rect x="180" y="145" width="60" height="8" fill="#0f172a" rx="1"/>
  <rect x="190" y="125" width="40" height="20" fill="#fef08a" stroke="#0f172a" stroke-width="2"/>
  <!-- Dome Top -->
  <path d="M 190,125 Q 210,100 230,125 Z" fill="#0f172a"/>
  <circle cx="210" cy="98" r="3" fill="#fef08a"/>

  <!-- Palm Tree on Coast Edge -->
  <path d="M 80,450 Q 110,380 90,320" stroke="#0f172a" stroke-width="6" fill="none"/>
  <circle cx="90" cy="315" r="25" fill="#0f172a"/>

  <!-- Surf Foam -->
  <path d="M 320,440 Q 380,430 450,445" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Info Overlay -->
  <rect x="30" y="30" width="300" height="48" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.2)"/>
  <text x="45" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="16">OLUVIL LIGHTHOUSE</text>
  <text x="45" y="72" fill="#fde047" font-family="system-ui, sans-serif" font-weight="600" font-size="10">COASTAL LANDMARK • 10 KM DISTANCE</text>
</svg>
