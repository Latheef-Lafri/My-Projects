<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="parkSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="tankWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#parkSky)"/>

  <!-- Distant Ampara Tank Water -->
  <path d="M 0,260 Q 400,240 800,260 L 800,340 L 0,340 Z" fill="url(#tankWater)"/>

  <!-- Lush Park Lawn Hills -->
  <path d="M 0,320 Q 250,290 500,310 Q 700,295 800,310 L 800,500 L 0,500 Z" fill="url(#grassGrad)"/>

  <!-- Paved Walking Trail -->
  <path d="M 100,500 C 200,440 280,410 400,410 C 520,410 650,450 750,500" stroke="#f1f5f9" stroke-width="28" fill="none" opacity="0.9"/>
  <path d="M 100,500 C 200,440 280,410 400,410 C 520,410 650,450 750,500" stroke="#cbd5e1" stroke-width="24" fill="none"/>

  <!-- Park Wooden Gazebo Pavilion -->
  <!-- Pillars -->
  <rect x="360" y="320" width="8" height="50" fill="#78350f"/>
  <rect x="432" y="320" width="8" height="50" fill="#78350f"/>
  <!-- Roof -->
  <polygon points="340,320 400,280 460,320" fill="#991b1b"/>
  <rect x="350" y="360" width="100" height="6" fill="#475569"/>

  <!-- Park Shady Banyan / Rain Trees -->
  <!-- Tree Left -->
  <rect x="180" y="310" width="14" height="60" fill="#78350f"/>
  <circle cx="187" cy="290" r="45" fill="#166534"/>
  <circle cx="160" cy="305" r="30" fill="#15803d"/>
  <circle cx="215" cy="305" r="32" fill="#15803d"/>

  <!-- Tree Right -->
  <rect x="620" y="300" width="16" height="70" fill="#78350f"/>
  <circle cx="628" cy="275" r="50" fill="#166534"/>
  <circle cx="660" cy="290" r="35" fill="#15803d"/>
  <circle cx="595" cy="290" r="35" fill="#15803d"/>

  <!-- Info Overlay -->
  <rect x="30" y="30" width="310" height="48" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.2)"/>
  <text x="45" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="16">GREEN PARK, AMPARA</text>
  <text x="45" y="72" fill="#4ade80" font-family="system-ui, sans-serif" font-weight="600" font-size="10">RECREATION &amp; NATURE • 22 KM DISTANCE</text>
</svg>
