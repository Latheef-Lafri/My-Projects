<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Local Day-Visit Planner</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px;">
  <div class="card" style="max-width: 500px; padding: 50px 30px;">
    <div style="font-size: 4rem; font-family: var(--font-heading); font-weight: 800; color: var(--primary-light);">404</div>
    <h1 style="font-size: 1.8rem; margin: 10px 0 14px;">Destination Not Found</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px;">
      The page or tourist attraction you are trying to reach does not exist or has been relocated.
    </p>
    <div style="display: flex; gap: 12px; justify-content: center;">
      <a href="/" class="btn btn-primary btn-sm">Return Home</a>
      <a href="/places.html" class="btn btn-secondary btn-sm">Browse Attractions</a>
    </div>
  </div>
</body>
</html>
